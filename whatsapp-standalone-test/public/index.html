<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Standalone WhatsApp Test Console</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #8b5cf6;
      --accent-hover: #7c3aed;
      --emerald: #10b981;
      --rose: #f43f5e;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 2rem;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    header {
      border-b: 1px solid var(--border-color);
      padding-bottom: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 800;
      background: linear-gradient(135deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 0.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 1.25rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
    }

    .status-badge {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      letter-spacing: 0.05em;
    }

    .status-disconnected { bg-color: rgba(244, 63, 94, 0.1); color: var(--rose); border: 1px solid rgba(244, 63, 94, 0.2); }
    .status-connecting { bg-color: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    .status-scanning { bg-color: rgba(245, 158, 11, 0.1); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.2); }
    .status-connected { bg-color: rgba(16, 185, 129, 0.1); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.2); }

    .grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media (min-width: 768px) {
      .grid {
        grid-template-columns: 3fr 2fr;
      }
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #334155;
      padding-bottom: 0.5rem;
      font-size: 0.875rem;
    }

    .info-label {
      color: var(--text-muted);
      font-weight: 600;
    }

    .info-value {
      font-family: monospace;
      font-weight: 700;
    }

    .btn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 0.75rem 1.5rem;
      font-weight: 700;
      border-radius: 0.75rem;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      font-size: 0.875rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-danger {
      background-color: transparent;
      color: var(--rose);
      border: 1px solid rgba(244, 63, 94, 0.3);
    }

    .btn-danger:hover {
      background-color: rgba(244, 63, 94, 0.1);
    }

    .button-group {
      display: flex;
      gap: 1rem;
    }

    .qr-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--border-color);
      border-radius: 1rem;
      padding: 1.5rem;
      min-height: 280px;
      background-color: rgba(0, 0, 0, 0.2);
    }

    .qr-image {
      max-width: 200px;
      border-radius: 0.5rem;
      background-color: white;
      padding: 0.5rem;
      box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.3);
    }

    input, textarea {
      width: 100%;
      background-color: rgba(0,0,0,0.3);
      border: 1px solid var(--border-color);
      padding: 0.75rem;
      border-radius: 0.75rem;
      color: white;
      font-size: 0.875rem;
      outline: none;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
    }

    label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .console {
      background-color: #0b0f19;
      border: 1px solid var(--border-color);
      border-radius: 1rem;
      padding: 1rem;
      height: 200px;
      overflow-y: auto;
      font-family: monospace;
      font-size: 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .log-line {
      display: flex;
      gap: 0.5rem;
      line-height: 1.4;
    }

    .log-time {
      color: #475569;
      flex-shrink: 0;
    }

    .log-msg {
      word-break: break-all;
    }

    .log-info { color: #cbd5e1; }
    .log-success { color: var(--emerald); font-weight: bold; }
    .log-error { color: var(--rose); font-weight: bold; }

    .error-banner {
      background-color: rgba(244, 63, 94, 0.05);
      border: 1px solid rgba(244, 63, 94, 0.2);
      padding: 0.75rem;
      border-radius: 0.75rem;
      font-size: 0.75rem;
      color: var(--rose);
      font-family: monospace;
      word-break: break-all;
    }
  </style>
</head>
<body>

<div class="container">
  
  <header>
    <div>
      <h1>WhatsApp Standalone Test Engine</h1>
      <p class="subtitle">Isolated local environment bypassing Supabase and Railway configurations</p>
    </div>
    <div>
      <button class="btn" id="refresh-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Refresh
      </button>
    </div>
  </header>

  <div class="grid">
    
    <!-- Controls & Actions -->
    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2 style="font-size: 1.125rem; font-weight: 700;">Connection Details</h2>
        <span class="status-badge status-disconnected" id="status-badge">disconnected</span>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0.75rem;">
        <div class="info-row">
          <span class="info-label">Active JID Number</span>
          <span class="info-value" id="info-phone">N/A</span>
        </div>
        <div class="info-row">
          <span class="info-label">Device Display Name</span>
          <span class="info-value" id="info-display">N/A</span>
        </div>
      </div>

      <div class="error-banner" id="error-banner" style="display: none;"></div>

      <div class="button-group">
        <button class="btn" id="start-btn" style="flex: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          Initialize Socket
        </button>
        <button class="btn btn-danger" id="reset-btn" style="flex: 1;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/></svg>
          Hard Reset Auth
        </button>
      </div>
      
      <!-- Send Message Form -->
      <div style="margin-top: 1rem; border-t: 1px solid var(--border-color); padding-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem;">
        <h3 style="font-size: 1rem; font-weight: 700; color: #cbd5e1;">Test Message Transmission</h3>
        
        <div class="form-group">
          <label>Recipient Phone Number (with Country Code)</label>
          <input type="text" id="send-to" placeholder="e.g. 923001234567" />
        </div>

        <div class="form-group">
          <label>Message Text</label>
          <textarea id="send-content" rows="2" placeholder="Enter message payload content..."></textarea>
        </div>

        <button class="btn" id="send-btn" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          Send Test message
        </button>
      </div>
    </div>

    <!-- QR scanner column -->
    <div class="card" style="align-items: center; justify-content: center;">
      <h2 style="font-size: 1.125rem; font-weight: 700; margin-bottom: 0.5rem; align-self: flex-start;">QR Pairing</h2>
      
      <div class="qr-container" id="qr-wrapper" style="width: 100%;">
        <p style="color: var(--text-muted); font-size: 0.875rem;">Initializing backend...</p>
      </div>
    </div>

  </div>

  <!-- Console Log Container -->
  <div class="card">
    <h2 style="font-size: 1.125rem; font-weight: 700;">Local Execution Trace</h2>
    <div class="console" id="console-logs"></div>
  </div>

</div>

<script>
  const statusBadge = document.getElementById('status-badge');
  const infoPhone = document.getElementById('info-phone');
  const infoDisplay = document.getElementById('info-display');
  const errorBanner = document.getElementById('error-banner');
  const qrWrapper = document.getElementById('qr-wrapper');
  const consoleLogs = document.getElementById('console-logs');
  
  const startBtn = document.getElementById('start-btn');
  const resetBtn = document.getElementById('reset-btn');
  const refreshBtn = document.getElementById('refresh-btn');
  const sendBtn = document.getElementById('send-btn');
  
  const sendTo = document.getElementById('send-to');
  const sendContent = document.getElementById('send-content');

  function addLog(msg, type = 'info') {
    const timestamp = new Date().toLocaleTimeString();
    const line = document.createElement('div');
    line.className = 'log-line';
    line.innerHTML = `<span class="log-time">[${timestamp}]</span><span class="log-msg log-${type}">${msg}</span>`;
    consoleLogs.appendChild(line);
    consoleLogs.scrollTop = consoleLogs.scrollHeight;
  }

  async function getStatus(silent = false) {
    try {
      const res = await fetch('/api/status');
      const data = await res.json();
      
      // Update badge
      statusBadge.className = `status-badge status-${data.status}`;
      statusBadge.textContent = data.status;

      // Update inputs/values
      infoPhone.textContent = data.phoneNumber ? `+${data.phoneNumber}` : 'N/A';
      infoDisplay.textContent = data.displayName || 'N/A';

      if (data.lastError) {
        errorBanner.style.display = 'block';
        errorBanner.textContent = data.lastError;
      } else {
        errorBanner.style.display = 'none';
      }

      // Update Send message button status
      if (data.status === 'connected') {
        sendBtn.removeAttribute('disabled');
      } else {
        sendBtn.setAttribute('disabled', 'true');
      }

      // Render QR
      if (data.status === 'scanning' && data.qrCode) {
        qrWrapper.innerHTML = `
          <img src="${data.qrCode}" class="qr-image" alt="QR Code" />
          <p style="font-size: 0.75rem; color: var(--emerald); font-weight: 700; margin-top: 1rem;">QR Ready for Scanning</p>
        `;
      } else if (data.status === 'connecting') {
        qrWrapper.innerHTML = `
          <div style="border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--accent); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
          <p style="font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem;">Connecting socket...</p>
        `;
      } else if (data.status === 'connected') {
        qrWrapper.innerHTML = `
          <div style="color: var(--emerald); font-size: 3rem;">✔</div>
          <p style="font-size: 0.875rem; color: var(--emerald); font-weight: 700; margin-top: 0.5rem;">Device Paired & Connected</p>
        `;
      } else {
        qrWrapper.innerHTML = `
          <p style="font-size: 0.875rem; color: var(--text-muted);">Session Disconnected</p>
        `;
      }

      if (!silent) {
        addLog(`Status sync completed: ${data.status.toUpperCase()}`, 'info');
      }

    } catch (e) {
      if (!silent) addLog(`Failed to query server state: ${e.message}`, 'error');
    }
  }

  // Action listeners
  startBtn.addEventListener('click', async () => {
    addLog('Requesting socket initialization...', 'info');
    try {
      const res = await fetch('/api/start', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        addLog('Initialization process successfully triggered.', 'success');
        setTimeout(() => getStatus(true), 1000);
      } else {
        addLog(`Initialization failed: ${data.error}`, 'error');
      }
    } catch (e) {
      addLog(`Initialization error: ${e.message}`, 'error');
    }
  });

  resetBtn.addEventListener('click', async () => {
    if (!confirm('This will purge the local auth directory (.auth_state) and force logout. Proceed?')) return;
    addLog('Executing auth state reset...', 'info');
    try {
      const res = await fetch('/api/reset', { method: 'POST' });
      const data = await res.json();
      if (data.success) {
        addLog('Credentials purged. Session fully reset.', 'success');
        setTimeout(() => getStatus(true), 1000);
      } else {
        addLog(`Reset failed: ${data.error}`, 'error');
      }
    } catch (e) {
      addLog(`Reset request error: ${e.message}`, 'error');
    }
  });

  refreshBtn.addEventListener('click', () => getStatus(false));

  sendBtn.addEventListener('click', async () => {
    const toVal = sendTo.value.trim();
    const contentVal = sendContent.value.trim();
    if (!toVal || !contentVal) return;

    addLog(`Sending message to ${toVal}...`, 'info');
    try {
      const res = await fetch('/api/send', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ to: toVal, content: contentVal })
      });
      const data = await res.json();
      if (data.success) {
        addLog(`Message sent successfully. ID: ${data.messageId}`, 'success');
        sendContent.value = '';
      } else {
        addLog(`Message transmission failed: ${data.error}`, 'error');
      }
    } catch (e) {
      addLog(`Transmission error: ${e.message}`, 'error');
    }
  });

  // Init
  getStatus(false);
  setInterval(() => getStatus(true), 3000);
  addLog('Standlone UI loaded. Server listening on http://localhost:3005', 'success');
</script>

<style>
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
</style>
</body>
</html>
